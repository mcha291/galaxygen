# Builds the deployable image and publishes it to GitHub Container Registry,
# tagged with the short commit (and `latest` on main). Public images on ghcr.io
# cost nothing to store or pull, which keeps the Azure side on its free grants.
name: image
on:
  push:
    branches: [main, frontend]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/galaxygen:${{ steps.tag.outputs.short }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/galaxygen:latest', github.repository_owner) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
